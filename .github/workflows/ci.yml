name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Run native tests
        run: pio test -e native

      - name: Run native tests under ASan/UBSan
        run: pio test -e native-san
        env:
          # alloc_dealloc_mismatch catches new/delete objects handed to a
          # free()-based teardown (the ESPAsyncWebServer _tempObject contract).
          # Leak checking stays off: the NimBLE mocks intentionally drop a few
          # one-time allocations (characteristics/services created in init()).
          ASAN_OPTIONS: alloc_dealloc_mismatch=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Static analysis (cppcheck)
        run: pio check -e native --fail-on-defect=high --fail-on-defect=medium

  build-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: http_echo
            libs: "me-no-dev/ESPAsyncWebServer@^1.2.4, me-no-dev/AsyncTCP@^1.1.1"
          - example: ble_config_wifi
            libs: "h2zero/NimBLE-Arduino@^2.0.0"
          - example: dual_transport
            libs: "h2zero/NimBLE-Arduino@^2.0.0, me-no-dev/ESPAsyncWebServer@^1.2.4, me-no-dev/AsyncTCP@^1.1.1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Cache PlatformIO platform and toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-espressif32

      # --lib . injects the WORKING TREE as the library, bypassing the
      # registry pin in the example's own platformio.ini — so every push
      # verifies current code + examples under the real xtensa toolchain.
      - name: Build example against working tree
        run: >
          pio ci examples/${{ matrix.example }}/src
          --lib .
          --board esp32-s3-devkitc-1
          --project-option="platform=espressif32@^7"
          --project-option="framework=arduino"
          --project-option="build_flags=-std=gnu++17"
          --project-option="lib_deps=${{ matrix.libs }}"
