name: PlatformIO Registry Publish

on:
  release:
    types: [published] # 当你发布一个新的 Release 时触发

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Run native tests
        run: pio test -e native

      - name: Run protocol suite with text mirroring disabled
        run: pio test -e native-omit-text

      - name: Run native tests under ASan/UBSan
        run: pio test -e native-san
        env:
          ASAN_OPTIONS: alloc_dealloc_mismatch=1:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

      - name: Static analysis (cppcheck)
        run: pio check -e native --fail-on-defect=high --fail-on-defect=medium

  build-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: http_echo
            libs: "ESP32Async/ESPAsyncWebServer@^3.6.0, ESP32Async/AsyncTCP@^3.3.2"
          - example: ble_config_wifi
            libs: "h2zero/NimBLE-Arduino@^2.0.0"
          - example: dual_transport
            libs: "h2zero/NimBLE-Arduino@^2.0.0, ESP32Async/ESPAsyncWebServer@^3.6.0, ESP32Async/AsyncTCP@^3.3.2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Cache PlatformIO platform and toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-espressif32

      - name: Build example against working tree
        run: >
          pio ci examples/${{ matrix.example }}/src
          --lib .
          --board esp32-s3-devkitc-1
          --project-option="platform=espressif32@^7"
          --project-option="framework=arduino"
          --project-option="build_flags=-std=gnu++17"
          --project-option="lib_deps=${{ matrix.libs }}"

  publish:
    runs-on: ubuntu-latest
    # Never ship to the registry with a red suite, a static-analysis defect,
    # or an example that no longer compiles on the device toolchain.
    needs: [test, build-examples]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Publish Library
        run: pio pkg publish --non-interactive
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
